<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky Draw Registration</title><link rel="stylesheet" href="style.css"></head><body class="registration-page"><div class="register-wrap"><div id="register" class="panel register-card"></div></div><script>
const qs=new URLSearchParams(location.search),eventId=qs.get('event'),root=document.getElementById('register');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){if(!eventId){root.innerHTML='<h2>Invalid registration link</h2>';return}const r=await fetch('/api/public/'+eventId);if(!r.ok){root.innerHTML='<h2>Event not found</h2>';return}const j=await r.json();root.innerHTML='<section class="mobile-pkm-hero"><div class="mobile-pkm-logo"><img src="/pkm-logo.png" alt="Pusat Khidmat Masyarakat DUN Sentosa"></div><div class="mobile-pkm-copy"><div class="eyebrow">PUSAT KHIDMAT MASYARAKAT</div><h1>DUN SENTOSA</h1><div class="hero-rule"></div><h2>LUCKY DRAW SYSTEM</h2><p>Bersama Rakyat <span>•</span> Untuk Sentosa</p></div><div class="mobile-pkm-slogan">Bersama Rakyat<br><em>Untuk Sentosa</em></div></section><div class="event-banner"><h2>'+esc(j.event.title)+'</h2><p>'+esc(j.event.date||'')+' '+esc(j.event.venue||'')+'</p></div>'+(j.event.status==='OPEN'?'<form id="rf" class="form"><label>Full Name as per NRIC *<input name="fullName" required autocomplete="off"></label><label>NRIC Number *<input name="nric" required autocomplete="off"></label><label>Contact Number *<input name="contact" required autocomplete="off"></label><button class="btn gold" type="submit">REGISTER NOW</button></form><div id="result"></div><p class="offline-note">● This registration is connected to the local event database.</p>':'<div class="alert error">Registration is currently closed for this event.</div>');if(document.getElementById('rf'))document.getElementById('rf').onsubmit=async e=>{e.preventDefault();const res=document.getElementById('result');try{const q=await fetch('/api/public/'+eventId+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await q.json();if(!q.ok){res.innerHTML='<div class="alert error">⚠ '+esc(d.error)+(d.duplicate?'<br><small>Matched: '+esc(d.duplicate.reasons.join(', '))+'</small>':'')+'</div>';return}res.innerHTML='<div class="alert success">✓ Registration successful<br><strong>Registration No: '+esc(d.registrationNo)+'</strong></div>';e.target.reset()}catch(x){res.innerHTML='<div class="alert error">Unable to connect to the event computer. Check local Wi-Fi.</div>'}}}
init();
</script></body></html>
